<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Planificateur d'Itinéraire Cyclable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([43.2965, 5.3698], 13); // Marseille

    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
    }).addTo(map);

    let markers = [];
    let routeLine = null;

    map.on('click', async (e) => {
      if (markers.length >= 2) {
        markers.forEach(m => map.removeLayer(m));
        if (routeLine) map.removeLayer(routeLine);
        markers = [];
      }

      const marker = L.marker(e.latlng).addTo(map);
      markers.push(marker);

      if (markers.length === 2) {
        const origin = [markers[0].getLatLng().lat, markers[0].getLatLng().lng];
        const destination = [markers[1].getLatLng().lat, markers[1].getLatLng().lng];

        try {
          const response = await fetch('http://localhost:8000/route', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ origin, destination }),
          });

          const data = await response.json();

          if (data.route) {
            routeLine = L.polyline(data.route, { color: 'blue', weight: 4 }).addTo(map);
            map.fitBounds(routeLine.getBounds());
          } else {
            alert("Erreur : " + data.error);
          }

        } catch (err) {
          alert("Échec de la requête : " + err);
        }
      }
    });
  </script>
</body>
</html>
